<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820">
<rect width="1000" height="820" fill="#FCFBF6"/>
<rect x="10" y="10" width="980" height="800" rx="22" fill="#ffffff" stroke="#E4E7DE" stroke-width="2"/>

<circle cx="92" cy="92" r="20" fill="#E2A53C"/><line x1="117.0" y1="92.0" x2="124.0" y2="92.0" stroke="#E2A53C" stroke-width="3" stroke-linecap="round"/><line x1="109.7" y1="109.7" x2="114.6" y2="114.6" stroke="#E2A53C" stroke-width="3" stroke-linecap="round"/><line x1="92.0" y1="117.0" x2="92.0" y2="124.0" stroke="#E2A53C" stroke-width="3" stroke-linecap="round"/><line x1="74.3" y1="109.7" x2="69.4" y2="114.6" stroke="#E2A53C" stroke-width="3" stroke-linecap="round"/><line x1="67.0" y1="92.0" x2="60.0" y2="92.0" stroke="#E2A53C" stroke-width="3" stroke-linecap="round"/><line x1="74.3" y1="74.3" x2="69.4" y2="69.4" stroke="#E2A53C" stroke-width="3" stroke-linecap="round"/><line x1="92.0" y1="67.0" x2="92.0" y2="60.0" stroke="#E2A53C" stroke-width="3" stroke-linecap="round"/><line x1="109.7" y1="74.3" x2="114.6" y2="69.4" stroke="#E2A53C" stroke-width="3" stroke-linecap="round"/>
<text x="140" y="86" font-family="DejaVu Serif" font-size="40" font-weight="bold" fill="#3F5E3A">Notre atelier fait</text>
<text x="140" y="134" font-family="DejaVu Serif" font-size="40" font-weight="bold" fill="#3F5E3A">une pause estivale</text>

<text x="60" y="206" font-family="DejaVu Sans" font-size="23" fill="#3A3A3A">Pour recevoir vos essentiels avant les vacances,</text>
<text x="60" y="240" font-family="DejaVu Sans" font-size="23" fill="#3A3A3A">pensez à <tspan font-weight="bold" fill="#3F5E3A">commander avant le 22 juillet</tspan>.</text>

<!-- callout box -->
<rect x="50" y="296" width="900" height="316" rx="18" fill="#EEF3E9" stroke="#CBD9C0" stroke-width="2"/>
<text x="120" y="346" font-family="DejaVu Sans" font-size="19" letter-spacing="2" fill="#6F9A52">LES DATES À RETENIR</text>
<line x1="120" y1="392" x2="120" y2="556" stroke="#CBD9C0" stroke-width="2"/>

  <circle cx="120" cy="392" r="26" fill="#3F5E3A"/>
  <g transform="translate(120,392)"><g stroke="#fff" stroke-width="2.4" fill="none"><rect x="-9" y="-6" width="18" height="16" rx="2.5"/><path d="M-4 -6 a4 5 0 0 1 8 0"/></g></g>
  <text x="178" y="386" font-family="DejaVu Sans" font-weight="bold" font-size="27" fill="#3F5E3A">22 juillet</text>
  <text x="178" y="416" font-family="DejaVu Sans" font-size="22" fill="#3A3A3A">Dernier jour pour commander</text>

  <circle cx="120" cy="474" r="26" fill="#3F5E3A"/>
  <g transform="translate(120,474)"><g stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-11 0 a11 11 0 0 1 22 0 q-5.5 -4 -11 0 q-5.5 -4 -11 0 Z" fill="#fff" stroke="none"/><line x1="0" y1="0" x2="0" y2="11"/><path d="M0 11 a3 3 0 0 0 5 0"/></g></g>
  <text x="178" y="468" font-family="DejaVu Sans" font-weight="bold" font-size="27" fill="#3F5E3A">22 juil. → 10 août</text>
  <text x="178" y="498" font-family="DejaVu Sans" font-size="22" fill="#3A3A3A">Atelier fermé — pause estivale</text>

  <circle cx="120" cy="556" r="26" fill="#3F5E3A"/>
  <g transform="translate(120,556)"><g stroke="#fff" stroke-width="2.2" fill="none"><rect x="-11" y="-6" width="13" height="11" rx="1"/><path d="M2 -2 h6 l4 4 v3 h-10 Z"/><circle cx="-5" cy="7" r="2.4" fill="#fff" stroke="none"/><circle cx="7" cy="7" r="2.4" fill="#fff" stroke="none"/></g></g>
  <text x="178" y="550" font-family="DejaVu Sans" font-weight="bold" font-size="27" fill="#3F5E3A">10 août</text>
  <text x="178" y="580" font-family="DejaVu Sans" font-size="22" fill="#3A3A3A">Reprise : vos commandes sont expédiées</text>

<text x="60" y="688" font-family="DejaVu Sans" font-size="23" fill="#3A3A3A">Les commandes passées pendant la fermeture seront préparées</text>
<text x="60" y="722" font-family="DejaVu Sans" font-size="23" fill="#3A3A3A">et expédiées dès notre retour, le 10 août.</text>
<text x="60" y="772" font-family="DejaVu Serif" font-style="italic" font-size="24" fill="#3F5E3A">Merci pour votre patience </text>
<g transform="translate(405,765)"><ellipse cx="0" cy="0" rx="9" ry="4.2" fill="#6F9A52" transform="rotate(-35)"/><ellipse cx="11" cy="-3" rx="9" ry="4.2" fill="#3F5E3A" transform="rotate(20 11 -3)"/></g>
</svg>